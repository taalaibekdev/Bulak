name: Release

# Сборка релизных артефактов по тегу вида v1.0.0.
#
# Какие секреты нужно завести в GitHub (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — keystore в base64: base64 -w0 bulak-release.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   PLAY_STORE_JSON_KEY      — JSON сервисного аккаунта Google Play (для автозагрузки)
#   APPSTORE_API_KEY_ID / APPSTORE_API_ISSUER_ID / APPSTORE_API_PRIVATE_KEY
#                            — ключ App Store Connect API (для TestFlight)
#
# Подробности: docs/publishing/signing.md

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  android:
    name: Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Проверки перед релизом
        run: |
          flutter analyze
          flutter test

      - name: Восстановить ключ подписи
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/bulak-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=bulak-release.jks
          EOF

      - name: Собрать App Bundle
        run: flutter build appbundle --release

      - name: Собрать APK
        run: flutter build apk --release

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      - name: Создать релиз на GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  ios:
    name: iOS IPA
    # Сборка iOS возможна только на macOS и требует сертификатов Apple.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Импортировать сертификаты и профиль
        if: ${{ secrets.APPSTORE_API_PRIVATE_KEY != '' }}
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_PRIVATE_KEY" > ~/private_keys/AuthKey_$APPSTORE_API_KEY_ID.p8

      - name: Собрать IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/ipa/*.ipa
          if-no-files-found: warn
