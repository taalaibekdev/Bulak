name: CI

# Проверка каждого изменения: форматирование, анализ, тесты и пробная
# сборка Android. Пока эти три шага зелёные, релиз можно собирать.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  quality:
    name: Формат · анализ · тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      - name: Проверка форматирования
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Статический анализ
        run: flutter analyze

      - name: Тесты
        run: flutter test --coverage

      - name: Сохранить отчёт о покрытии
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Сборка Android
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Зависимости
        run: flutter pub get

      # Сборка без ключей: проверяем, что проект компилируется.
      # Подписанные сборки делает release.yml по тегу.
      - name: Собрать APK (проверка компиляции)
        run: flutter build apk --release

      - name: Собрать App Bundle (проверка компиляции)
        run: flutter build appbundle --release

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
